name: Retry Failed Robotics Briefing

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: retry-robotics-briefing
  cancel-in-progress: false

jobs:
  retry-failed-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout recovery code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Retry a recent failure after 30 minutes
        uses: actions/github-script@v7
        with:
          script: |
            const { retryBriefing } = require('./.github/scripts/briefing-recovery.cjs');
            await retryBriefing({ github, context, core });
