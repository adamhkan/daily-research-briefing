name: Daily Robotics Briefing

on:
  workflow_dispatch:
  schedule:
    - cron: "15 11 * * *" # daily

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: daily-robotics-briefing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pilot-window:
    runs-on: ubuntu-latest
    outputs:
      api_enabled: ${{ steps.pilot.outputs.api_enabled }}
    steps:
      - name: Checkout pilot configuration
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Check bounded Codex pilot pause
        id: pilot
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { apiRunDecision } = require('./.github/scripts/codex-pilot-window.cjs');
            const config = JSON.parse(fs.readFileSync('config/codex-pilot.json', 'utf8'));
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: context.runId,
            });
            const decision = apiRunDecision(run.created_at, config);
            core.setOutput('api_enabled', String(decision.apiEnabled));
            core.info(`${decision.reportDate}: ${decision.reason}`);

  build-briefing:
    needs: pilot-window
    if: ${{ needs.pilot-window.outputs.api_enabled == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Resolve original report date
        id: report-date
        uses: actions/github-script@v7
        with:
          script: |
            const { reportDates } = require('./.github/scripts/briefing-recovery.cjs');
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: context.runId,
            });
            const { reportDate, submissionDate } = reportDates(run.created_at);
            core.setOutput('report_date', reportDate);
            core.setOutput('submission_date', submissionDate);

      - name: Initialize log directory
        run: |
          echo "RUN_LOG_DIR=logs/briefings/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install first-page OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr

      - name: Restore affiliation evidence cache
        uses: actions/cache@v4
        with:
          path: .cache/affiliations
          key: ${{ runner.os }}-affiliations-v4-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-affiliations-v4-

      - name: Ensure filter file exists
        run: |
          if [ ! -f config/filters.yaml ]; then
            cp config/filters.example.yaml config/filters.yaml
          fi

      - name: Run regression tests
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=src python -u -m unittest discover -s tests -v \
            2>&1 | PYTHONPATH=src python -u -m daily_robotics_briefing.log_capture --out "$RUN_LOG_DIR/python-tests.log"
          node --test tests/test_briefing_recovery.cjs tests/test_codex_pilot_window.cjs \
            2>&1 | PYTHONPATH=src python -u -m daily_robotics_briefing.log_capture --out "$RUN_LOG_DIR/recovery-tests.log"

      - name: Generate briefing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPORT_DATE: ${{ steps.report-date.outputs.report_date }}
          SUBMISSION_DATE: ${{ steps.report-date.outputs.submission_date }}
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=src python -u -m daily_robotics_briefing.main \
            --filters config/filters.yaml \
            --submission-date "$SUBMISSION_DATE" \
            --out "reports/$REPORT_DATE/$REPORT_DATE.md" \
            --out-json "reports/$REPORT_DATE/$REPORT_DATE.json" \
            --out-html "reports/$REPORT_DATE/$REPORT_DATE.html" \
            2>&1 | PYTHONPATH=src python -u -m daily_robotics_briefing.log_capture --out "$RUN_LOG_DIR/briefing.log"

      - name: Upload application logs even if generation failed
        if: ${{ always() && env.RUN_LOG_DIR != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: briefing-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RUN_LOG_DIR }}
          retention-days: 30
          if-no-files-found: warn

      - name: Ensure GitHub Pages static settings
        run: |
          touch reports/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      - name: Commit report if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "chore: add daily robotics briefing"
            git push
          fi

      - name: Commit application logs even if generation failed
        if: ${{ always() && env.RUN_LOG_DIR != '' }}
        run: bash .github/scripts/persist-run-logs.sh

  deploy-pages:
    runs-on: ubuntu-latest
    needs: build-briefing
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
