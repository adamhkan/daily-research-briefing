name: Daily Robotics Briefing

on:
  workflow_dispatch:
  schedule:
    - cron: "15 11 * * *" # daily

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: daily-robotics-briefing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Resolve original report date
        id: report-date
        uses: actions/github-script@v7
        with:
          script: |
            const { reportDates } = require('./.github/scripts/briefing-recovery.cjs');
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: context.runId,
            });
            const { reportDate, submissionDate } = reportDates(run.created_at);
            core.setOutput('report_date', reportDate);
            core.setOutput('submission_date', submissionDate);

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install first-page OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr

      - name: Restore affiliation evidence cache
        uses: actions/cache@v4
        with:
          path: .cache/affiliations
          key: ${{ runner.os }}-affiliations-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-affiliations-v2-

      - name: Ensure filter file exists
        run: |
          if [ ! -f config/filters.yaml ]; then
            cp config/filters.example.yaml config/filters.yaml
          fi

      - name: Run regression tests
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
          node --test tests/test_briefing_recovery.cjs

      - name: Generate briefing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPORT_DATE: ${{ steps.report-date.outputs.report_date }}
          SUBMISSION_DATE: ${{ steps.report-date.outputs.submission_date }}
        run: |
          PYTHONPATH=src python -m daily_robotics_briefing.main \
            --filters config/filters.yaml \
            --submission-date "$SUBMISSION_DATE" \
            --out "reports/$REPORT_DATE/$REPORT_DATE.md" \
            --out-json "reports/$REPORT_DATE/$REPORT_DATE.json" \
            --out-html "reports/$REPORT_DATE/$REPORT_DATE.html"

      - name: Ensure GitHub Pages static settings
        run: |
          touch reports/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      - name: Commit report if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "chore: add daily robotics briefing"
            git push
          fi

  deploy-pages:
    runs-on: ubuntu-latest
    needs: build-briefing
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
